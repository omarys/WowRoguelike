# Install with: mise run hooks
#
# Every dotnet hook runs through `mise exec --` so it uses the SDK `mise.toml`
# pins rather than whatever `dotnet` the caller's PATH resolves to. That is not
# belt-and-braces: this repo's project files are `.slnx`, which needs SDK 9.0.200
# or newer, and a machine whose system `dotnet` is .NET 8 fails the build hook
# with `MSB4068: The element <Solution> is unrecognized`. mise also ignores a
# config file it has not been told to trust — so `mise trust` once per clone,
# and the failure then reads "config is not trusted" instead of an SDK error.
#
# Two speeds, deliberately. Building is ~6s and catches compile errors and new
# warnings on every commit; the test suite is ~4.5min and runs on push. Putting
# the suite in pre-commit would make every commit slow enough to reach for
# `--no-verify`, which is worse than not having the hook.
#
# There is no CI here, so these hooks are the only automated check. Keep them
# working.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      # WoW asset extraction was considered and rejected; this is the guard that
      # keeps a multi-megabyte export from being committed by accident.
      - id: check-added-large-files
        args: ["--maxkb=512"]
      # The .fsproj compile order IS the dependency graph, so a malformed
      # project file is a real failure rather than a formatting nit.
      - id: check-xml

  - repo: local
    hooks:
      - id: dotnet-build
        name: dotnet build (Release, zero warnings)
        entry: mise exec -- dotnet build WowRoguelike.slnx -c Release -v q --nologo
        language: system
        pass_filenames: false
        files: \.(fs|fsproj|slnx)$

      # The Story assembly embeds a *compiled* .ink.json, so an edited .ink that
      # is not recompiled commits a narrative the game does not play. This runs
      # only when a .ink file is staged, and it modifies the JSON — stage the
      # regenerated file, which is the point.
      - id: ink-compile
        name: compile the ink narrative
        entry: mise run ink
        language: system
        pass_filenames: false
        files: \.ink$

      # Not `dotnet test` alone: the suite proves the invariants hold, but only
      # `runs 120 4000` proves the game still behaves. Kept off pre-commit
      # because it is slow, and on pre-push because a broken push is worse.
      - id: dotnet-test
        name: dotnet test
        entry: mise exec -- dotnet test tests/WowRoguelike.Tests/WowRoguelike.Tests.fsproj --nologo -v q
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: \.(fs|fsproj)$

      - id: sim-runs
        name: sim runs (120 seeds still resolve)
        entry: mise exec -- dotnet src/WowRoguelike.Harness/bin/Release/net10.0/sim.dll runs 120 4000
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: \.(fs|fsproj)$
