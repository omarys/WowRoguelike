# Dev and build dependencies, and the tasks that drive them.
#
# Pinned to the `10` major rather than "latest": the projects target net10.0, so
# a major bump would silently install a runtime the build cannot use.
[tools]
dotnet = "10"
pre-commit = "latest"
# The ink compiler. The Story assembly embeds a *compiled* .ink.json, so the
# narrative is a build product like any other — nothing else here can produce it.
"npm:inkjs" = "2.4.0"

[env]
# Keep the SDK out of the system-wide lookup path. Without this a plain `dotnet`
# resolves against /usr/lib64/dotnet, which ships .NET 8 only, and every run
# fails with "You must install or update .NET". mise sets this for the `dotnet`
# tool already; it is stated here so the requirement is visible in the repo.
DOTNET_MULTILEVEL_LOOKUP = "0"

[tasks.ink]
description = "Compile the ink narrative into the JSON the Story assembly embeds"
sources = ["src/WowRoguelike.Story/Scripts/wailing_caverns.ink"]
outputs = ["src/WowRoguelike.Story/Scripts/wailing_caverns.ink.json"]
run = '''
inkjs-compiler -o src/WowRoguelike.Story/Scripts/wailing_caverns.ink.json src/WowRoguelike.Story/Scripts/wailing_caverns.ink
f=src/WowRoguelike.Story/Scripts/wailing_caverns.ink.json
# The compiler writes a UTF-8 BOM and no final newline, while the repo's hooks
# require no BOM and exactly one newline. Without this normalisation every
# compile leaves the tree dirty and `end-of-file-fixer` rewrites the file.
sed -i '1s/^\xEF\xBB\xBF//' "$f"
printf '%s\n' "$(cat "$f")" > "$f.tmp" && mv "$f.tmp" "$f"
'''

[tasks.build]
description = "Build the whole solution in Release"
depends = ["ink"]
run = "dotnet build WowRoguelike.slnx -c Release --nologo"

# The whole game, runnable without the SDK: dist/WowRoguelike.Game with its
# Assets/ folder and MonoGame's native libraries. Framework-dependent, so the
# machine still needs the .NET 10 runtime; add `--self-contained -r linux-x64`
# for a folder that needs nothing at all (~90 MB larger).
[tasks.publish]
description = "Publish the playable game to dist/"
depends = ["build"]
run = "dotnet publish src/WowRoguelike.Game/WowRoguelike.Game.fsproj -c Release -o dist --nologo"

[tasks.test]
description = "Run the test suite"
run = "dotnet test tests/WowRoguelike.Tests/WowRoguelike.Tests.fsproj --nologo -v q"

[tasks.run]
description = "Play the game (MonoGame window, commands typed on stdin)"
run = "dotnet run --project src/WowRoguelike.Game -c Release"

# The headless harness. Everything below runs in Release: Debug timings are
# meaningless, and the benchmark numbers are only comparable in Release.
[tasks.sim]
description = "Run the headless harness; pass args, e.g. `mise run sim -- runs 120 4000`"
run = "dotnet run --project src/WowRoguelike.Harness -c Release --"

[tasks.runs]
description = "Outcome distribution over 120 seeds — the behavioural regression signal"
run = "dotnet run --project src/WowRoguelike.Harness -c Release -- runs 120 4000"

[tasks.story]
description = "Play the Wailing Caverns story (ink); pass -i for interactive choices"
run = "dotnet run --project src/WowRoguelike.Harness -c Release -- story"

[tasks.dungeon]
description = "Generate a floorplan and render it as ASCII; pass a seed to vary it"
run = "dotnet run --project src/WowRoguelike.Harness -c Release -- dungeon"

[tasks.maps]
description = "Render the Wailing Caverns rooms extracted from images/"
run = "dotnet run --project src/WowRoguelike.Harness -c Release -- maps"

[tasks.bench]
description = "Tick cost, search cost, and the hand-rolled heap against the BCL's"
run = "dotnet run --project src/WowRoguelike.Harness -c Release -- bench"

[tasks.diagnose]
description = "Per-bucket tick cost, and the cost of a search that cannot succeed"
run = "dotnet run --project src/WowRoguelike.Harness -c Release -- diagnose"

[tasks.hooks]
description = "Install the git hooks (run once after cloning)"
run = "pre-commit install --install-hooks && pre-commit install --hook-type pre-push"

[tasks.hooks-run]
description = "Run every hook against the whole tree"
run = "pre-commit run --all-files"
